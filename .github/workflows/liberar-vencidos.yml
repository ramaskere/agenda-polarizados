name: Liberar turnos vencidos

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  liberar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/liberar-vencidos
        run: |
          curl -sf -X GET "${SITE_URL}/api/liberar-vencidos" \
            -H "x-cron-secret: ${CRON_SECRET}"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
