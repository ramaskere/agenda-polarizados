<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agenda — Panel</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .contenedor { max-width: 720px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tabs button { padding: 8px 14px; border: 1px solid var(--borde); border-radius: 8px; background: #fff; cursor: pointer; }
    .tabs button.activo { background: var(--azul); color: #fff; border-color: var(--azul); }
    .fila-form { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .fila-form input { flex: 1; min-width: 120px; }
    .fila-form button { padding: 10px 14px; border: none; border-radius: 8px; background: var(--azul); color: #fff; cursor: pointer; }
    .estado-pill { padding: 3px 8px; border-radius: 20px; font-size: 12px; }
    .estado-pendiente_pago { background: #fff3cd; }
    .estado-confirmado { background: #d4edda; }
    .estado-cancelado, .estado-vencido { background: #f8d7da; }
    .estado-completado { background: #d1ecf1; }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>Panel de turnos</h1>

    <div id="login">
      <label for="email">Email</label>
      <input id="email" type="email" />
      <label for="pass">Contraseña</label>
      <input id="pass" type="password" />
      <button class="principal" id="btn-login">Entrar</button>
      <p class="error" id="error-login" style="display:none"></p>
    </div>

    <div id="panel" style="display:none">
      <div class="tabs">
        <button data-tab="turnos" class="activo">Turnos</button>
        <button data-tab="disponibilidad">Disponibilidad</button>
        <button data-tab="bloqueos">Bloqueos</button>
        <button data-tab="servicios">Servicios</button>
        <button data-tab="recursos">Recursos</button>
      </div>

      <section id="tab-turnos"><div id="tabla-turnos">Cargando…</div></section>

      <section id="tab-disponibilidad" style="display:none">
        <div class="fila-form">
          <select id="disponibilidad-servicio" style="flex:1; min-width:160px; padding:10px; border:1px solid var(--borde); border-radius:8px;"></select>
        </div>
        <div id="disponibilidad-calendario" style="margin-top:14px"></div>
      </section>

      <section id="tab-bloqueos" style="display:none">
        <div class="fila-form">
          <input type="datetime-local" id="bloqueo-desde" />
          <input type="datetime-local" id="bloqueo-hasta" />
          <input type="text" id="bloqueo-motivo" placeholder="Motivo (feriado, etc.)" />
          <button id="btn-agregar-bloqueo">Bloquear</button>
        </div>
        <div id="tabla-bloqueos"></div>
      </section>

      <section id="tab-servicios" style="display:none">
        <div class="fila-form">
          <input type="text" id="servicio-nombre" placeholder="Nombre del servicio" />
          <input type="number" id="servicio-duracion" placeholder="Duración (min)" />
          <button id="btn-agregar-servicio">Agregar</button>
        </div>
        <div id="tabla-servicios"></div>
      </section>

      <section id="tab-recursos" style="display:none">
        <div class="fila-form">
          <input type="text" id="recurso-nombre" placeholder="Nombre (ej: Box 3)" />
          <button id="btn-agregar-recurso">Agregar</button>
        </div>
        <div id="tabla-recursos"></div>
      </section>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../calendario.js"></script>
  <script src="admin.js"></script>
</body>
</html>
